services:
  # バックエンド (FastAPI)
  - type: web
    name: tech-feed-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # Renderのダッシュボードで手動設定
      - key: DATABASE_URL
        sync: false  # Neon 等の接続文字列を手動設定
      - key: CORS_ORIGINS
        value: http://localhost:5173,http://localhost:3000,https://tech-feed.onrender.com,https://tech-feed-frontend.onrender.com,https://tech-feed-frontend-7v22.onrender.com

  # フロントエンド (React/Vite)
  - type: web
    name: tech-feed-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    envVars:
      - key: VITE_API_URL
        value: https://tech-feed.onrender.com
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
