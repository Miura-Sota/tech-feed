services:
  # バックエンド (FastAPI)
  - type: web
    name: tech-feed-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false  # Renderのダッシュボードで手動設定
      - key: DB_PATH
        value: /data/tech_feed.db
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1

  # フロントエンド (React/Vite)
  - type: web
    name: tech-feed-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    envVars:
      - key: VITE_API_URL
        value: https://tech-feed-backend.onrender.com
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
